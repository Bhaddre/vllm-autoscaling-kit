name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: 5.5.0
      KUBECONFORM_VERSION: 0.6.7
    steps:
      - uses: actions/checkout@v4

      - name: install kustomize + kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - run: ./scripts/validate.sh

  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r loadtest/requirements.txt pytest
      - run: pytest -q loadtest/tests
