apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - ../../base
components:
  - ../../components/servicemonitor
patches:
  # pin to the L4 node pool. GKE adds this label to GPU nodes for you.
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          cloud.google.com/gke-accelerator: nvidia-l4
  # GKE managed Prometheus doesn't serve the plain Prometheus API on 9090.
  # Point this at whatever Prometheus-compatible endpoint you actually run.
  - target:
      kind: ScaledObject
      name: vllm
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/serverAddress
        value: http://prometheus-operated.monitoring.svc:9090
